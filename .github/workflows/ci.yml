name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: |
          xcodegen generate
          xcodebuild -project ADBDeck.xcodeproj -scheme ADBDeck -destination 'platform=macOS' test
