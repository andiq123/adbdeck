name: ADBDeck
options:
  bundleIdPrefix: com.andi
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  ADBDeck:
    type: application
    platform: macOS
    sources:
      - path: ADBDeck
        excludes:
          - Resources
      - path: ADBDeck/Resources/platform-tools
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andi.ADBDeck
        PRODUCT_NAME: ADB Deck
        PRODUCT_MODULE_NAME: ADBDeck
        INFOPLIST_FILE: ADBDeck/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - ADBDeckTests
  ADBDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ADBDeckTests
    dependencies:
      - target: ADBDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andi.ADBDeckTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ADB Deck.app/Contents/MacOS/ADB Deck"
        BUNDLE_LOADER: "$(TEST_HOST)"
